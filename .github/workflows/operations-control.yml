name: Operations Control

on:
  pull_request:
    branches:
      - main
    paths:
      - "CORE/**"
      - "Agents/**"
      - "W*"
      - "Calc*"
      - "Sim*"
      - "scripts/**"
      - "tests/**"
      - "registry/**"
      - ".github/workflows/operations-control.yml"
  push:
    branches:
      - main
    paths:
      - "CORE/**"
      - "Agents/**"
      - "W*"
      - "Calc*"
      - "Sim*"
      - "scripts/**"
      - "tests/**"
      - "registry/**"
      - ".github/workflows/operations-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Operations release controls
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator
        run: python -m py_compile scripts/validate_operations_control.py scripts/operations_release.py

      - name: Test validator
        run: python -m unittest discover -s tests -v

      - name: Validate Operations control surface
        run: python scripts/validate_operations_control.py

      - name: Build LS Web review bundle
        run: python scripts/operations_release.py build --output-dir dist

      - name: Upload LS Web review bundle
        uses: actions/upload-artifact@v4
        with:
          name: operations-web-review-${{ github.sha }}
          path: |
            dist/operations-release-manifest.json
            dist/operations-web-review-bundle.zip
          if-no-files-found: error
          retention-days: 14
